name: Setup miniforge
description: |
  DO NOT USE THIS ACTION DIRECTLY.
  Use dmlc/xgboost-devops/actions/miniforge-setup so that it can dispatch to
  a specific version of the implementation.
inputs:
  environment-name:
    description: Name of Conda environment
    required: true
  environment-file:
    description: Path to environment file
    required: true

runs:
  using: "composite"
  steps:
    - name: Configure package downloads
      shell: bash
      run: |
        # CI runners intermittently fail on package downloads and DNS lookups.
        # Set these before Miniforge setup so environment creation also benefits.
        # Mamba has its own overrides; Conda settings alone do not change its limits.
        cat >> "$GITHUB_ENV" <<'EOF'
        CONDA_REMOTE_CONNECT_TIMEOUT_SECS=60
        CONDA_REMOTE_READ_TIMEOUT_SECS=120
        CONDA_REMOTE_MAX_RETRIES=5
        CONDA_REMOTE_BACKOFF_FACTOR=2
        MAMBA_REMOTE_CONNECT_TIMEOUT_SECS=60
        MAMBA_REMOTE_MAX_RETRIES=5
        MAMBA_REMOTE_BACKOFF_FACTOR=2
        PIP_DEFAULT_TIMEOUT=60
        PIP_RETRIES=8
        EOF
    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-variant: Miniforge3
        miniforge-version: latest
        activate-environment: ${{ inputs.environment-name }}
        environment-file: ${{ inputs.environment-file }}
        use-mamba: true
        auto-update-conda: true
    - name: Display Conda env
      shell: bash -el {0}
      run: |
        conda info
        conda list
