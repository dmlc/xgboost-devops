## List of CI containers with definitions and build arguments

# Each container will be built using the definition from
# containers/dockerfile/Dockerfile.CONTAINER_DEF

x-rapids_versions:
  stable: &rapids_version "26.08"

x-cuda_versions:
  default: &cuda_version "13.3.0"
  cuda12: &cuda12_version "12.9.0"
  nccl: &nccl_version "2.30.7-1"

xgb-ci.gpu_build_rockylinux8:
  container_def: gpu_build_rockylinux8
  build_args:
    CUDA_VERSION: *cuda_version
    NCCL_VERSION: *nccl_version
    RAPIDS_VERSION: *rapids_version
    ARCH: x86_64

xgb-ci.gpu_build_rockylinux8_aarch64:
  container_def: gpu_build_rockylinux8
  build_args:
    CUDA_VERSION: *cuda_version
    NCCL_VERSION: *nccl_version
    RAPIDS_VERSION: *rapids_version
    ARCH: aarch64

# CUDA 12 builders are used for the xgboost-cu12 PyPI package and clang CI jobs.
xgb-ci.gpu_build_cuda12_rockylinux8:
  container_def: gpu_build_cuda12_rockylinux8
  build_args:
    CUDA_VERSION: *cuda12_version
    NCCL_VERSION: *nccl_version
    ARCH: x86_64

xgb-ci.gpu_build_cuda12_rockylinux8_aarch64:
  container_def: gpu_build_cuda12_rockylinux8
  build_args:
    CUDA_VERSION: *cuda12_version
    NCCL_VERSION: *nccl_version
    ARCH: aarch64

xgb-ci.gpu_build_r_rockylinux8:
  container_def: gpu_build_r_rockylinux8
  build_args:
    CUDA_VERSION: *cuda_version
    R_VERSION: "4.3.2"

xgb-ci.cpu_build_r_doc:
  container_def: cpu_build_r_doc

xgb-ci.gpu:
  container_def: gpu
  build_args:
    CUDA_VERSION: *cuda_version
    NCCL_VERSION: *nccl_version
    RAPIDS_VERSION: *rapids_version
    ARCH: x86_64

xgb-ci.gpu_aarch64:
  container_def: gpu
  build_args:
    CUDA_VERSION: *cuda_version
    NCCL_VERSION: *nccl_version
    RAPIDS_VERSION: *rapids_version
    ARCH: aarch64

# CUDA 12 runtime images provide native test environments for xgboost-cu12.
xgb-ci.gpu_cuda12:
  container_def: gpu
  build_args:
    CUDA_VERSION: *cuda12_version
    NCCL_VERSION: *nccl_version
    RAPIDS_VERSION: *rapids_version
    ARCH: x86_64

xgb-ci.gpu_cuda12_aarch64:
  container_def: gpu
  build_args:
    CUDA_VERSION: *cuda12_version
    NCCL_VERSION: *nccl_version
    RAPIDS_VERSION: *rapids_version
    ARCH: aarch64

xgb-ci.cpu:
  container_def: cpu
  build_args:
    ARCH: x86_64

xgb-ci.cpu_aarch64:
  container_def: cpu
  build_args:
    ARCH: aarch64

xgb-ci.manylinux_2_28_x86_64:
  container_def: manylinux_2_28_x86_64

xgb-ci.manylinux_2_28_aarch64:
  container_def: manylinux_2_28_aarch64

xgb-ci.jvm:
  container_def: jvm

xgb-ci.jvm_gpu_build:
  container_def: jvm_gpu_build
  build_args:
    CUDA_VERSION: *cuda_version
    NCCL_VERSION: *nccl_version

xgb-ci.i386:
  container_def: i386
